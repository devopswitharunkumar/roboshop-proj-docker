networks:
  default:
    external:
      name: roboshop
  
services:
  mongodb:
    image: mongodb:v1
    container_name: mongodb
    networks:
    - roboshop
  
  catalogue:
    image: catalogue:v1
    container_name: catalogue
    networks:
    - roboshop
    depends_on:
    - mongodb
  
  redis:
    image: redis
    container_name: redis
  
  user:
    image: user:v1
    container_name: user
    networks:
    - roboshop
    depends_on:
      - redis
      - mongodb
    
  cart:
    image: cart:v1
    container_name: cart
    networks:
    - roboshop
    depends_on:
      - redis
      - mongodb
    
  web:
    image: web:v1
    container_name: web
    networks:
    - roboshop
    ports:
    - "8080:80"
    depends_on:
    - catalogue
    - user
    - cart
    
  shipping:
    image: shipping:v1
    container_name: shipping
    networks:
    - roboshop
  
  mysql:
    image: mysql:v1
    container_name: mysql

#if u dont give container-name docker creates automatically like roboshop-docker-cataloge:v1 like that give by default