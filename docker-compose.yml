networks:
  default:
    name: roboshop

#internal --> Docker Compose automatically creates the network when you run docker compose up and automatically deletes it when you run docker compose down.Scope: It is designed specifically for the containers defined inside that single docker-compose.yml file.
#external --> Docker Compose will not create or delete this network. It expects the network to already exist on the host machine (usually created manually via docker network create network_name).Scope: This is used so that multiple completely separate projects or standalone containers can connect to each other and communicate. If you run docker compose down, the containers stop, but the external network stays alive.
#if u dont mention ---> internal: ---> by default it uses internal
services:
  mongodb:
    image: mongodb:v1
    container_name: mongodb
    networks:
    - roboshop
  
  catalogue:  
    image: catalogue:v1
    container_name: catalogue
    networks:
    - roboshop
    depends_on:
    - mongodb
  
  redis:
    image: redis
    container_name: redis
  
  user:
    image: user:v1
    container_name: user
    networks:
    - roboshop
    depends_on:
      - redis
      - mongodb
    
  cart:
    image: cart:v1
    container_name: cart
    networks:
    - roboshop
    depends_on:
      - redis
      - mongodb
      
  mysql:
    image: mysql:v1
    container_name: mysql
    networks:
    - roboshop

#if u dont give container-name docker creates automatically like roboshop-docker-cataloge:v1 like that give by default

  shipping:
    image: shipping:v1
    container_name: shipping
    networks:
    - roboshop
    depends_on: 
    - mysql
    - cart

  rabbitmq:
    image: rabbitmq
    container_name: rabbitmq
    networks:
    - roboshop
    environment:
    - RABBITMQ_DEFAULT_USER=roboshop
    - RABBITMQ_DEFAULT_PASS=roboshop123

  payment:
    image: payment:v1
    container_name: payment
    networks:
    - roboshop
    depends_on: 
    - cart
    - user

  web:
    image: web:v1
    container_name: web
    networks:
    - roboshop
    ports:
    - "8080:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment